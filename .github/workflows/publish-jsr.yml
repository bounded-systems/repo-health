name: publish-jsr
on:
  # Tag-driven for normal releases; manual (workflow_dispatch) so a release can
  # publish without a git tag when tag creation is governance-restricted. JSR
  # versions by deno.json, not the tag — republishing an existing version is a
  # no-op-fail, so this is safe to run against main.
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch: {}
permissions:
  contents: read
  id-token: write # OIDC → JSR provenance
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: npx jsr publish
