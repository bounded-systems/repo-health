name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: typecheck
        run: deno check mod.ts cli.ts
      - name: test
        run: deno test --allow-read
      - name: dogfood — repo-health gates its own structure
        run: |
          deno run -A cli.ts cycles    --include src --gate
          deno run -A cli.ts god-files --include src --maxLoc 400 --gate
