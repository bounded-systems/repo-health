name: version

# Versioning via the bounded-systems mint capability. Validates .release/ intents
# (fails closed on a malformed one) and previews the next version on every PR.
# Pinned to an immutable mint commit SHA; bump when mint tags.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  version:
    uses: bounded-systems/mint/.github/workflows/version.yml@37d3bb741aa52686c1adc5a65b367f3bf243a9e6 # mint v0.8.0
    with:
      ref: 60ad36e630a95808689c7a95f6a5eb954d5d7b14
